method: lora

num_train_epochs: 3
per_device_train_batch_size: 16
gradient_accumulation_steps: 1
learning_rate: 2.0e-5
weight_decay: 0.0
warmup_ratio: 0.0
lr_scheduler_type: linear
max_length: 128
logging_steps: 500
save_steps: 500
save_total_limit: 1
seed: 666

# The released models were loaded in BF16. Trainer mixed precision was not
# separately enabled in the original recipe.
model_dtype: bfloat16
bf16: false
fp16: false

lora:
  rank: 8
  alpha: 16
  dropout: 0.1
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
