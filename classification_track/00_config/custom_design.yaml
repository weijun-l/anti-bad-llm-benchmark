name: my_classification_backdoor
dataset: sst2
model: meta-llama/Llama-3.1-8B

attack:
  # Options: syntactic, lws, pos_badnets
  type: pos_badnets
  target_label: 1
  poison_rate: 0.2

  # POS-BadNets only. Use a prepared CSV, or run mine_pos_triggers.py first.
  trigger_file: ../01_backdoor_data_creation/04_pos_badnets_attack/triggers/custom_pool.csv
  max_triggers: 10
  min_insertions: 1
  max_insertions: 3
  balance_triggers: true

  # Syntactic/LWS only: outputs produced by the documented upstream method.
  # generated_training_file: path/to/mixed_training.json
  # generated_test_file: path/to/triggered_test.json

seed: 42
